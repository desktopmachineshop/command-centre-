[package]
name = "command-centre-desktop"
version = "0.1.0"
description = "Command Centre desktop app: the PWA in a window, plus the worker daemon as a sidecar"
edition = "2021"
publish = false

[lib]
name = "command_centre_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# In-app updates: signed installers from the command centre (/api/desktop/update).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Linking: the link-code handshake with the server (blocking, on its own thread).
ureq = { version = "2", features = ["json"] }
