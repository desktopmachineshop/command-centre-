<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command Centre settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <h1>Command Centre</h1>
      <p class="hint">Connect this computer to your command centre server. The window then shows the server's app,
        and this computer takes video, GPU and Claude Code jobs while the app is running.</p>
      <form id="form">
        <label>Server URL
          <input name="serverUrl" type="url" placeholder="https://command-centre.up.railway.app" required />
        </label>
        <label>Worker token
          <input name="token" type="password" placeholder="WORKER_TOKEN (or ADMIN_TOKEN) from Railway" required />
        </label>
        <label>Computer name
          <input name="nodeName" placeholder="Defaults to this computer's hostname" />
        </label>
        <label class="check"><input name="workerEnabled" type="checkbox" /> Run the worker while the app is open</label>
        <label class="check"><input name="launchAtLogin" type="checkbox" /> Start Command Centre when I sign in</label>
        <p id="error" class="error" hidden></p>
        <button type="submit">Save and connect</button>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
