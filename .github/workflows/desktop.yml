name: Desktop

# Builds the Windows installers (NSIS .exe and .msi) for apps/desktop, with the
# worker daemon bundled as a Node single-executable sidecar.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the worker sidecar (cc-worker-x86_64-pc-windows-msvc.exe)
        run: pnpm --filter @cc/worker build:sea
      - name: Build the installers
        run: pnpm --filter @cc/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: command-centre-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
