# Local stack: Postgres (with pgvector for the later brain index) + the server.
#   cp .env.example .env   # set ADMIN_TOKEN, and CLAUDE_CODE_OAUTH_TOKEN or AGENT_RUNNER=echo
#   docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
      POSTGRES_DB: cc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc"]
      interval: 5s
      retries: 10

  server:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://cc:cc@postgres:5432/cc
    volumes:
      - data:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  data:
